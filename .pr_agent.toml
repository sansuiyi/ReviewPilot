# NOTE: This file is consumed by a hosted review bot (a separate, closed-source
# service). It is NOT read by the open-source agent in this repository; some keys
# below (e.g. the [review_agent] section) only exist in that hosted agent.

[pr_reviewer]
enable_review_labels_effort = true
enable_auto_approval = true
persistent_finding_state = true

[github_app]
pr_commands = [
    "/describe --pr_description.publish_description_as_comment=true",
    "/improve",
    "/agentic_review"
]

handle_push_trigger = true
push_commands = [
    "/improve",
    "/agentic_review"
]

[review_agent]
enabled = true
publish_output = true
demand_self_review = true
approve_pr_on_self_review = true
